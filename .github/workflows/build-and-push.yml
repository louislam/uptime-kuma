# Builda a imagem propria do fork (docker/winker.dockerfile), publica no Docker Hub
# e faz o deploy em producao (EKS winkernetes, namespace monitor-infra).
#
# Registry: tiwinker/* (ADR-0006 do repo infrastructure) — conta privada.
# Tags: SEMPRE imutaveis. Nao publicamos `latest` nem `prod` de proposito:
# tag movel tira o rollback por tag.
#
# ATENCAO: push em master DEPLOYA EM PRODUCAO. O Deployment usa strategy
# Recreate (o PVC e ReadWriteOnce), entao todo deploy tem ~1-2 min de queda:
# o pod velho morre ANTES de o novo subir. Nao ha rolling update possivel.
#
# Secrets exigidos no repo/org:
#   DOCKER_USERNAME, DOCKER_PASSWORD          (publicar a imagem)
# AWS: sem secret. O job de deploy assume a role ci-deploy-uptime-kuma por OIDC
# (permissions: id-token: write).
name: build-and-push

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

# Duas execucoes em paralelo publicariam tags fora de ordem; a fila e serial.
concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with: { persist-credentials: false }

      # O login-action falha com mensagem generica quando o secret nao existe;
      # este passo nomeia o que falta antes de gastar o build.
      - name: Confere os secrets do registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          missing=""
          [ -z "$DOCKER_USERNAME" ] && missing="$missing DOCKER_USERNAME"
          [ -z "$DOCKER_PASSWORD" ] && missing="$missing DOCKER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) ausente(s):$missing — cadastre em Settings > Secrets > Actions."
            exit 1
          fi

      # A tag de release casa a versao do upstream com o numero do build:
      # 2.5.3-winker.7 diz de que versao do Kuma saiu e qual build do fork e.
      # A tag sha- existe para achar a imagem a partir de um commit do git.
      - name: Deriva as tags da imagem
        id: meta
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          release="tiwinker/uptime-kuma:${version}-winker.${RUN_NUMBER}"
          commit="tiwinker/uptime-kuma:sha-${SHA:0:7}"
          {
            echo "release=${release}"
            echo "commit=${commit}"
            # a tag sozinha, sem o repositorio — e o que o helm --set image.tag espera
            echo "tag=${version}-winker.${RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          echo "Publicando: ${release} e ${commit}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login no Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/winker.dockerfile
          # Os nodes do EKS que rodam o Kuma sao amd64 (t3.medium); build
          # multi-arch aqui so custaria tempo de QEMU.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.release }}
            ${{ steps.meta.outputs.commit }}
          # provenance gera manifest list com entradas "unknown/unknown" no Hub,
          # que confundem na hora de conferir a imagem publicada.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        env:
          RELEASE: ${{ steps.meta.outputs.release }}
          COMMIT_TAG: ${{ steps.meta.outputs.commit }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag de release | \`${RELEASE}\` |"
            echo "| Tag por commit | \`${COMMIT_TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            echo "O job \`deploy\` abaixo sobe esta tag no EKS."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deploy no EKS winkernetes, namespace monitor-infra.
  #
  # O chart NAO vive aqui: ele vive no repo `infrastructure`
  # (helm-packages/tools/uptimekuma) e e publicado no repo Helm em S3. Este job
  # baixa o pacote publicado e sobrescreve SO a tag da imagem. Chart alterado =>
  # publicar versao nova no S3 e subir CHART_VERSION abaixo.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CLUSTER: winkernetes
      NAMESPACE: monitor-infra
      RELEASE: uptime-kuma
      CHART_REPO: s3://winker-helm-packages/tools/uptimekuma
      # Pinado de proposito: chart novo so entra em producao quando alguem sobe
      # este numero. Precedente do que acontece sem isso: o pipeline do Chatwoot
      # fixa --version 1.1.18, alguem publicou 1.1.19 e reverteu com push --force,
      # e ate hoje o index.yaml anuncia uma versao que nao existe no bucket.
      CHART_VERSION: "0.1.1"
      # >= 3.17: e a primeira com --take-ownership. Sem ela, o primeiro upgrade
      # sobre objetos criados por `kubectl apply` falha com "invalid ownership
      # metadata" e o conserto vira anotar recurso de producao na mao.
      HELM_VERSION: v3.18.4
    steps:
      # Credencial temporaria via OIDC (ADR-0014 do repo infrastructure): sem chave
      # AWS guardada no GitHub. A role so aceita este repo na branch master.
      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::203462224675:role/ci-deploy-uptime-kuma
          role-session-name: gh-uptime-kuma-${{ github.run_id }}
          aws-region: us-east-1

      - name: Kubeconfig
        run: |
          set -eu
          aws eks update-kubeconfig --no-cli-pager --name "$CLUSTER"
          kubectl -n "$NAMESPACE" get deploy "$RELEASE" -o name

      - name: Instala helm, o plugin s3 e garante o kubectl
        run: |
          set -eu
          # kubectl vem na imagem do runner, mas isso nao e contrato — se sumir,
          # a falha apareceria so no meio do deploy.
          command -v kubectl >/dev/null || {
            curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          }
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
          tar -zxf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
          helm plugin install https://github.com/hypnoglow/helm-s3.git

      - name: Baixa o chart publicado
        run: |
          set -eu
          helm repo add winker-uptimekuma "$CHART_REPO"
          helm repo update winker-uptimekuma
          helm pull winker-uptimekuma/uptimekuma --version "$CHART_VERSION" --untar
          test -f ./uptimekuma/Chart.yaml

      # Antes de qualquer coisa que mexa no pod: o backup do banco precisa do
      # Kuma DE PE. O CronJob tem podAffinity no pod `app=uptime-kuma` (o PVC e
      # RWO, so monta no mesmo node), entao com o Deployment derrubado ele fica
      # Pending. E a migration da imagem nova nao tem volta automatica: se algo
      # der errado, restaurar este .db e o unico caminho confiavel.
      - name: Backup do banco antes de mexer
        run: |
          set -eu
          job="uptime-kuma-backup-ci-${GITHUB_RUN_NUMBER}"
          kubectl -n "$NAMESPACE" create job "$job" --from=cronjob/uptime-kuma-backup
          if ! kubectl -n "$NAMESPACE" wait --for=condition=complete "job/$job" --timeout=300s; then
            echo "::error::O backup nao completou. Abortando ANTES de tocar no Deployment."
            kubectl -n "$NAMESPACE" logs "job/$job" --tail=50 || true
            exit 1
          fi

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -eu
          helm upgrade --install "$RELEASE" ./uptimekuma -f ./uptimekuma/values.yaml \
            --namespace "$NAMESPACE" \
            --take-ownership \
            --set image.tag="$IMAGE_TAG" \
            --wait --timeout 5m

      # --wait ja falha se o rollout nao completar; isto deixa o motivo no log
      # em vez de so o codigo de saida.
      - name: Confere o rollout
        if: always()
        run: |
          kubectl -n "$NAMESPACE" rollout status "deploy/$RELEASE" --timeout=120s || true
          kubectl -n "$NAMESPACE" get pod -l app=uptime-kuma -o wide
          echo "--- migrations no boot ---"
          kubectl -n "$NAMESPACE" logs -l app=uptime-kuma --tail=40 | grep -iE "migrat|patch|error" || true

      - name: Resumo do deploy
        if: always()
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`$RELEASE\` em \`$NAMESPACE\` |"
            echo "| Chart | \`uptimekuma-$CHART_VERSION\` (S3) |"
            echo "| Imagem | \`tiwinker/uptime-kuma:$IMAGE_TAG\` |"
            echo ""
            echo "Rollback: \`helm -n $NAMESPACE rollback $RELEASE\`."
            echo "Se o problema for o BANCO (migration), rollback de release nao resolve —"
            echo "restaure o .db do backup em \`s3://kuma-99cb2431/uptime-kuma/\`."
          } >> "$GITHUB_STEP_SUMMARY"

name: Auto Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-server
  cancel-in-progress: true

on:
  push:
    branches: [master, 1.23.X, 3.0.X]
  pull_request:
permissions: {}

jobs:
  auto-test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: true
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025, ubuntu-24.04-arm]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node: [26]

    steps:
      - run: git config --global core.autocrlf false # Mainly for Windows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # The cache is scoped to the pull request's merge ref, so it cannot poison
      # the base branch (the vector in the TanStack incident used pull_request_target).
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Install latest npm to test the new policy - npm approve-scripts
      - run: npm install npm -g

      # Print the npm version
      - run: npm --version

      # Apprise is not pre-installed on the runners, so install it from upstream
      # (via uv) to run the Apprise notification provider test instead of skipping it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Apprise
        run: uv tool install "apprise~=2.0.1" --with paho-mqtt --with "slixmpp>=1.16.0"
      - name: Add uv tools to PATH
        if: runner.os != 'Windows'
        run: echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Verify Apprise
        run: apprise --version

      # sipsak is not pre-installed on the runners either, so install it to run
      # the SIP options monitor test instead of skipping it.
      - name: Install sipsak
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends sipsak
      - name: Verify sipsak
        if: runner.os == 'Linux'
        run: sipsak --version

      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm clean-install --no-fund
      - run: npm run build

      - name: Login to Docker Hub
        if: github.repository == 'louislam/uptime-kuma' && runner.os == 'Linux' && runner.arch == 'X64'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The SFTP testcontainer is pulled from GHCR; anonymous pulls share the runner IP's rate limit.
      - name: Login to GitHub Container Registry
        if: github.repository == 'louislam/uptime-kuma' && runner.os == 'Linux' && runner.arch == 'X64'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - run: npm run test-backend
        env:
          HEADLESS_TEST: 1
          JUST_FOR_TEST: ${{ secrets.JUST_FOR_TEST }}

  check-linters:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - run: git config --global core.autocrlf false # Mainly for Windows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      #    Tempoary disable until we understand TanStack npm supply-chain compromise
      #      - name: Cache/Restore node_modules
      #        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      #        id: node-modules-cache
      #        with:
      #          path: node_modules
      #          key: node-modules-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm clean-install --no-fund
      - run: npm run lint:prod

  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_VERSION: ~1.64.1
    steps:
      - run: git config --global core.autocrlf false # Mainly for Windows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # The cache is scoped to the pull request's merge ref, so it cannot poison
      # the base branch (the vector in the TanStack incident used pull_request_target).
      # Kept apart from the auto-test key, as the runner image differs.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-e2e-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('**/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm clean-install --no-fund

      - name: Point apt at a cacheable archive dir
        run: |
          mkdir -p "$HOME/.apt-archives/partial"
          chmod 777 "$HOME/.apt-archives/partial"
          sudo tee /etc/apt/apt.conf.d/99-playwright-cache >/dev/null <<EOF
          Dir::Cache::archives "$HOME/.apt-archives";
          APT::Keep-Downloaded-Packages "true";
          EOF

      - name: Compute weekly apt cache key
        id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.apt-archives
          key: apt-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ steps.apt-week.outputs.week }}
          restore-keys: |
            apt-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-

      - name: Install Playwright ${{ env.PLAYWRIGHT_VERSION }}
        run: npx playwright@${{ env.PLAYWRIGHT_VERSION }} install --with-deps chromium

      # apt runs as root, leaving root-owned lock/partial that the cache's tar cannot read.
      - name: Hand the apt archives back to the cache
        if: always()
        run: sudo chown -R "$USER" "$HOME/.apt-archives"

      - run: npm run build
      - run: npm run test-e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: private/playwright-report
          retention-days: 14

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: private/playwright-test-results
          retention-days: 14

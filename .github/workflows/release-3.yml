name: Release 3.X

# 3.X release pipeline (dispatch from master).
# Kept separate from release.yml so the 2.5.X maintenance releases are untouched.
# All release logic lives in extra/release/*.mjs and is shared by both workflows.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version number (e.g., 3.0.0, or 3.0.0-beta.0 for beta)"
        required: true
        type: string
      previous_version:
        description: "Previous version tag for changelog (e.g., 2.1.0-beta.3)"
        required: true
        type: string
      is_beta:
        description: "Mark this as a beta (pre-release) release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry Run (The docker image will not be pushed to registries. PR will still be created.)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release3-${{ inputs.is_beta }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # 1. Create the release branch, bump the version and create the draft PR
  #    Re-runnable: reuses the existing open PR if there is one
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 0 # Fetch all history and tags for update-version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Install dependencies
        run: node extra/release/install-deps.mjs

      - name: Prepare release branch and PR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_IS_BETA: ${{ inputs.is_beta }}
          RELEASE_PREVIOUS_VERSION: ${{ inputs.previous_version }}
          RELEASE_BASE_BRANCH: "master"
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node extra/release/prepare-release.mjs --setup-branch

      - name: Set PR number output
        id: pr
        run: echo "pr_number=$(cat ./tmp/pr-number.txt)" >> "$GITHUB_OUTPUT"

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}

  # 2. Squash merge the release PR into master
  #    Re-runnable: skips if the PR is already merged, or if there is no PR at all
  merge-pr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: node extra/release/install-deps.mjs

      - name: Merge release PR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
        run: node extra/release/merge-pr.mjs

      - name: Set merge SHA output
        id: sha
        if: hashFiles('tmp/merge-sha.txt') != ''
        run: echo "sha=$(cat ./tmp/merge-sha.txt)" >> "$GITHUB_OUTPUT"

    outputs:
      merge_sha: ${{ steps.sha.outputs.sha }}

  # 3. Generate changelog (LLM categorization) and create the draft release
  #    Re-runnable independently: this is the flaky LLM part, re-run just this job on failure
  draft-release:
    needs: merge-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0 # Fetch all history and tags for changelog generation

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - uses: $/.github/actions/setup-atlascloud
        with:
          api-key: ${{ secrets.ATLASCLOUD_API_KEY }}

      - name: Install dependencies
        run: node extra/release/install-deps.mjs

      - name: Create draft release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_IS_BETA: ${{ inputs.is_beta }}
          RELEASE_PREVIOUS_VERSION: ${{ inputs.previous_version }}
          RELEASE_BASE_BRANCH: "master"
          DRY_RUN: ${{ inputs.dry_run }}
          # No merge commit when nothing needed bumping: tag the dispatched master commit
          MERGE_SHA: ${{ needs.merge-pr.outputs.merge_sha || github.sha }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: node extra/release/create-draft-release.mjs

  # 4. Build the frontend dist ONCE, upload it to the draft release and share
  #    it with the docker-images job via a workflow artifact
  #    Re-runnable: rebuilds only if ./tmp/dist.tar.gz is missing, uploads with --clobber
  build-and-upload-assets:
    needs: [merge-pr, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout the merged release branch code (merge_sha), not the workflow-dispatch SHA,
      # so package.json is already bumped to the release version before building.
      # Otherwise the frontend FRONTEND_VERSION (from npm_package_version) would be stale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.merge-pr.outputs.merge_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Build dist and upload assets to the draft release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
        run: node extra/release/build-and-upload-assets.mjs

      - name: Upload dist as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ inputs.version }}
          path: ./dist
          retention-days: 90

      - name: Upload dist.tar.gz as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-tar-${{ inputs.version }}
          path: ./tmp/dist.tar.gz
          retention-days: 90

  # 5. Build and push all docker images from the release commit, reusing the dist
  #    built by build-and-upload-assets (the frontend is never rebuilt here)
  #    Re-runnable: partial pushes are overwritten safely
  docker-images:
    needs: [merge-pr, build-and-upload-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.merge-pr.outputs.merge_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: node extra/release/install-deps.mjs

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ inputs.version }}
          path: ./dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push images
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_IS_BETA: ${{ inputs.is_beta }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node extra/release/build-images.mjs

  # 6. Bump the version in the "How to Update" wiki page, last.
  #    The GitHub wiki is its own git repository (louislam/uptime-kuma.wiki.git).
  #    Re-runnable: does nothing when the page is already on the target version
  update-wiki:
    needs: docker-images
    # A beta must not point the update docs at a pre-release
    if: inputs.is_beta == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: node extra/release/install-deps.mjs

      - name: Update wiki version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The wiki is part of this repo, so the release PAT can push to it
          WIKI_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: node extra/release/update-wiki.mjs
